<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Titan Estates</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(135deg, #1e40af, #1e3a8a);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-card {
    background: white;
    border-radius: 12px;
    padding: 2.5rem;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 20px 25px rgba(0,0,0,0.2);
  }
  .login-logo { text-align: center; font-size: 24px; font-weight: 600; color: #1e40af; margin-bottom: 0.5rem; }
  .login-subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 2rem; }
  label { display: block; font-size: 13px; color: #666; margin-bottom: 0.4rem; margin-top: 1rem; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px;
    font-size: 14px; font-family: inherit;
  }
  .login-btn {
    width: 100%; padding: 12px; background: #1e40af; color: white; border: none;
    border-radius: 6px; font-weight: 500; cursor: pointer; margin-top: 1.5rem; font-size: 14px;
  }
  .login-btn:hover { background: #1e3a8a; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .error-msg { color: #dc2626; font-size: 13px; margin-top: 1rem; text-align: center; display: none; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">🏠 Titan Estates</div>
  <div class="login-subtitle">Admin Login</div>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">

    <button type="submit" class="login-btn" id="loginBtn">Log In</button>
    <div class="error-msg" id="errorMsg"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabaseClient = supabase.createClient(
  'https://chazzeivbcgvazgvkbsd.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNoYXp6ZWl2YmNndmF6Z3ZrYnNkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjQ0NDUsImV4cCI6MjEwNTE0MDQ0NX0.GL9jg4aoVb71yXO0OyMWDoGkps_Vy_H9lEBNuN1Ok8k'
);

// If already logged in, skip straight to admin panel
(async () => {
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) window.location.href = 'admin.html';
})();

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errorMsg = document.getElementById('errorMsg');
  errorMsg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('password').value
  });

  if (error) {
    errorMsg.textContent = 'Login failed: ' + error.message;
    errorMsg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Log In';
  } else {
    window.location.href = 'admin.html';
  }
});
</script>

</body>
</html>
